<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 16" width="10" height="16">
  <!-- Serif arm (top stroke of numeral 1) -->
  <line x1="2" y1="5.5" x2="5" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Toggle pill track (stem of numeral 1) -->
  <rect x="3.5" y="2.5" width="3" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <!-- Knob at top = on -->
  <circle cx="5" cy="4.8" r="0.9" fill="currentColor"/>
</svg>
